server.port=8083

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
totp.encryption.key=${TOTP_ENCRYPTION_KEY}
totp.preauth.expiry-minutes=5
totp.issuer=ChemOS
totp.lockout.max-attempts=5
totp.lockout.duration-minutes=15
login.lockout.max-attempts=5
login.lockout.duration-minutes=15

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.environment=production
info.app.port=8083

logging.level.root=WARN
logging.level.chemos=INFO
