server.port=8083

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
totp.encryption.key=${TOTP_ENCRYPTION_KEY}
totp.preauth.expiry-minutes=5
totp.issuer=ChemOS
totp.lockout.max-attempts=5
totp.lockout.duration-minutes=15
login.lockout.max-attempts=5
login.lockout.duration-minutes=15

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.environment=production
info.app.port=8083

logging.level.root=WARN
logging.level.chemos=INFO

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.login-url=${APP_LOGIN_URL:}

# Email campaign service (proxied via /api/v1/email/**). Blank => endpoints answer 503.
app.email-service.base-url=${EMAIL_SERVICE_URL:}
app.email-service.api-key=${EMAIL_SERVICE_API_KEY:}
